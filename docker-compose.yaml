services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9011'
    ports:
      # 9010 is what the s3 secret points at.
      - '9010:9000'
      - '9011:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/soundboard &&
      echo 'bucket ready'
      "

volumes:
  minio-data:
